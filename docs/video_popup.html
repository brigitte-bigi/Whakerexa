<!DOCTYPE html>

<html lang="en">
<head>

    <title>video_popup.css</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="web, css, html5, framework, accessibility, disability"/>

    <link rel="stylesheet" href="../wexa_statics/css/wexa.css" type="text/css" media="all" />
    <link rel="stylesheet" href="../wexa_statics/css/video_popup.css" type="text/css" media="all" />

    <script src="../wexa_statics/js/video_popup.js" type="application/javascript"></script>
</head>

<!-- ---------------------------------------------------------------- -->

<body>

<header>
    <nav>
        <ul>
            <li><a class="external-link" href="https://sppas.org/">SPPAS</a></li>
            <li><a class="external-link" href="https://whakerpy.sf.net">WhakerPy</a></li>
            <li><a class="external-link" href="https://whakerexa.sf.net">Whakerexa</a></li>
        </ul>
    </nav>
    <h1>video_player.css</h1>
    <h2>A framework to open videos in a dialog</h2>
</header>

<main>
    <!--
        The dialog doesn't have to be necessary in the same place of the button to open it,
        Furthermore, a popup video can be open by multiple buttons with its id not only one
    -->
    <dialog id="popup-demo" class="popup-video">
        <video id="popup-video-demo" controls="true" preload="none">
            <source src="../samples/demo_video.webm" type="video/webm"/>
        </video>
        <button name="popup-close-btn" onclick="close_popup_video('demo')">
            &#10060;
        </button>
    </dialog>

    <h2>Popup video with image pre-visualisation</h2>
    <figure class="img-video-visualization" style="width: 35vw; height: auto;">
        <img src="../samples/demo_video.png" alt="Video preview"/>
        <button name="play-btn" onclick="play_popup_video('demo')">&#9658;</button>
    </figure>

    <h2>Popup video with just a play button</h2>
    <!-- use a container if you want to center the button (not necessary a 'figure', the figure is required only for image pre-visualization) -->
    <button name="play-btn" onclick="play_popup_video('demo')">&#9658;</button>
</main>

<footer>
    <p>Copyright @ 2023-2024 Brigitte Bigi - Laboratoire Parole et Langage, Aix-en-Provence, France</p>
</footer>
</body>
</html>
